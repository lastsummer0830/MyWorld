<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="MyWorld">
  <!-- B안 — 낮과 밤이 한 밴드에서 갈리고, 경계에 유리 구슬. 색 출처는 a.svg와 동일 -->
  <defs>
    <radialGradient id="mwbDay" cx="0.5" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#FFF4DC"/>
      <stop offset="0.62" stop-color="#FFE9B8"/>
      <stop offset="1" stop-color="#C9A876"/>
    </radialGradient>
    <linearGradient id="mwbSheen" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#E0F7FA" stop-opacity="0.6"/>
      <stop offset="0.42" stop-color="#E0F7FA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E0F7FA" stop-opacity="0.24"/>
    </linearGradient>
    <clipPath id="mwbOrb"><circle cx="420" cy="160" r="118"/></clipPath>
  </defs>

  <!-- 여름 낮 / 여름밤 -->
  <rect x="0"   y="0" width="420" height="320" fill="#FFE9B8"/>
  <rect x="420" y="0" width="860" height="320" fill="#1C2238"/>

  <!-- 낮 쪽 잔디선 -->
  <path d="M0 262 Q140 246 300 258 L420 264 L420 320 L0 320 Z" fill="#549E46"/>
  <path d="M0 288 Q160 276 420 286 L420 320 L0 320 Z" fill="#3E7C3A"/>

  <!-- 밤 쪽 반딧불이 -->
  <g fill="#FFD580">
    <circle cx="596" cy="60"  r="3"   opacity="0.75"/>
    <circle cx="676" cy="272" r="2.5" opacity="0.6"/>
    <circle cx="792" cy="46"  r="2"   opacity="0.55"/>
    <circle cx="880" cy="286" r="3"   opacity="0.7"/>
    <circle cx="1010" cy="52" r="2.5" opacity="0.6"/>
    <circle cx="1092" cy="268" r="2"  opacity="0.5"/>
    <circle cx="1168" cy="88" r="3.5" opacity="0.85"/>
    <circle cx="1224" cy="204" r="2.5" opacity="0.6"/>
    <circle cx="1246" cy="128" r="2"  opacity="0.55"/>
  </g>

  <!-- 경계의 유리 구슬 -->
  <g clip-path="url(#mwbOrb)">
    <circle cx="420" cy="160" r="118" fill="url(#mwbDay)"/>
    <path d="M312 198 L528 198 L498 244 L456 276 L420 286 L386 270 L344 237 Z" fill="#5B4028"/>
    <path d="M420 286 L386 270 L344 237 L378 208 Z" fill="#4E3620"/>
    <ellipse cx="420" cy="198" rx="106" ry="23" fill="#549E46"/>
    <path d="M327 188 A106 23 0 0 1 513 188 A106 23 0 0 0 327 188 Z" fill="#66B152" opacity="0.85"/>
    <ellipse cx="468" cy="202" rx="27" ry="9" fill="#3FA8BF"/>
    <rect x="372" y="140" width="10" height="56" fill="#5B4028"/>
    <circle cx="377" cy="125" r="31" fill="#3E7C3A"/>
    <circle cx="400" cy="136" r="22" fill="#549E46"/>
    <circle cx="359" cy="142" r="18" fill="#66B152"/>
    <circle cx="386" cy="106" r="19" fill="#66B152"/>
    <circle cx="448" cy="189" r="7" fill="#66B152"/>
    <circle cx="340" cy="191" r="6" fill="#549E46"/>
  </g>
  <circle cx="420" cy="160" r="118" fill="url(#mwbSheen)"/>
  <circle cx="420" cy="160" r="118" fill="none" stroke="#E0F7FA" stroke-opacity="0.8" stroke-width="2.5"/>
  <path d="M348 90 A118 118 0 0 1 416 50" fill="none" stroke="#FFF4DC" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>

  <!-- 워드마크는 밤 쪽에. 대비 #FFF4DC on #1C2238 = 14.2:1 -->
  <text x="600" y="205"
        font-family="'Josefin Sans','Josefin Sans SemiBold',Futura,'Century Gothic',sans-serif"
        font-size="140" font-weight="600" letter-spacing="4" fill="#FFF4DC"
        textLength="600" lengthAdjust="spacingAndGlyphs">MyWorld</text>
</svg>
